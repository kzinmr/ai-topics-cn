# shelley-active-crawl ジョブがこのファイルを読み、crawl_policy に従ってwikiを拡張する。
#
# Fields:
#   slug:           wiki concepts/ slug (required)
#   title:          display name (required)
#   crawl_policy:   crawling policy (required)
#     - prerequisites: discover and ingest prerequisite concepts
#     - laterals:     discover and ingest lateral/related concepts
#     - deepdive:     deep-dive into latest developments and case studies
#     - monitor:      no crawling; trending watch only
#     - paused:       completely inactive
#   priority:       high / medium / low (default: medium)
#   search_hints:   search query hints (optional)
#   wiki_pages:     related existing wiki pages (optional; also auto-detected)
#   notes:          notes (optional)
#   added:          date added (YYYY-MM-DD)
#   last_crawled:   last crawl date (auto-updated by job)

